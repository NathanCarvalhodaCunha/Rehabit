spring.application.name=rehabit-api
server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:file:./data/rehabit;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.upload-dir=uploads

rehabit.jwt.secret=${REHABIT_JWT_SECRET:rehabit-tcc-dev-secret-troque-em-producao-0123456789}
rehabit.jwt.expiracao-ms=14400000
