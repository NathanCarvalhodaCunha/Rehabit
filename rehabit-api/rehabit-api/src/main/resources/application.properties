spring.application.name=rehabit-api
server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:file:./data/rehabit;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.upload-dir=uploads

rehabit.jwt.secret=${REHABIT_JWT_SECRET:rehabit-tcc-dev-secret-troque-em-producao-0123456789}
# 30 dias. O token é stateless (não dá para revogar antes de expirar), mas
# 4h obrigava o profissional a refazer login várias vezes no mesmo dia de
# atendimento. "Sair" continua limpando a sessão do aparelho na hora.
rehabit.jwt.expiracao-ms=${REHABIT_JWT_EXPIRACAO_MS:2592000000}

# --- Envio de e-mail (recuperação de senha e confirmação de cadastro) ---
# Dois caminhos de saída, escolhidos por qual deles estiver configurado:
#
#   BREVO_API_KEY + MAIL_FROM -> API HTTP do Brevo. É o caminho de produção:
#     o plano gratuito do Render bloqueia as portas de SMTP (25, 465 e 587)
#     desde setembro de 2025, e por HTTPS na 443 passa.
#   MAIL_USERNAME + MAIL_PASSWORD -> SMTP. Serve para rodar local e para
#     hospedagem que não bloqueia essas portas. No Gmail é preciso uma
#     "senha de app", não a senha da conta.
#   Nenhum dos dois -> o e-mail é escrito no console e a API segue
#     funcionando, o que basta para desenvolver e demonstrar.
rehabit.mail.brevo.api-key=${BREVO_API_KEY:}
# Só muda em teste, para apontar para um servidor falso; em branco usa o
# endereço real da API do Brevo.
rehabit.mail.brevo.url=${BREVO_API_URL:}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

rehabit.mail.remetente=${MAIL_FROM:${MAIL_USERNAME:}}
rehabit.mail.nome-remetente=${MAIL_FROM_NAME:Rehabit}

# Endereço público da pasta Login/ (ex.: https://usuario.github.io/Rehabit/Login).
# Quando vazio, o e-mail de recuperação traz só o código de 6 dígitos —
# sem link, porque abrindo o site por file:// não existe URL para apontar.
rehabit.app.url-login=${REHABIT_APP_URL:}

# Validade do código/link de recuperação de senha e do código de cadastro.
rehabit.recuperacao.expiracao-minutos=${REHABIT_RECUPERACAO_EXPIRACAO_MIN:30}
rehabit.verificacao.expiracao-minutos=${REHABIT_VERIFICACAO_EXPIRACAO_MIN:15}

# Checagem de DNS (registro MX) do domínio do e-mail no cadastro.
rehabit.email.validar-dns=${REHABIT_VALIDAR_EMAIL_DNS:true}
# Exigir código enviado por e-mail para concluir o cadastro. Em branco =
# automático: liga quando o envio de e-mail está configurado.
rehabit.email.confirmar-cadastro=${REHABIT_CONFIRMAR_CADASTRO:}
