spring.application.name=rehabit-api
server.port=${PORT:8080}

# Sem AUTO_SERVER: ele abria um servidor TCP do H2 em todas as interfaces, com
# o usuário sa sem senha, e qualquer processo da máquina que lesse a chave do
# arquivo de trava entrava no banco com os prontuários. A API é a única que
# abre este arquivo; para olhar o banco com outra ferramenta, pare a API antes.
spring.datasource.url=jdbc:h2:file:./data/rehabit
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# "update" cria tabelas e colunas novas sozinho, inclusive no PostgreSQL de
# produção (o perfil cloud herda daqui). Nunca apaga nem renomeia nada: veja
# no README ("Evolução do banco") o risco e o caminho para migrações (Flyway).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Sem "Open Session In View": ligado (o padrão), cada requisição segurava uma
# conexão do banco até terminar — e o SSE do goniômetro dura até 30 minutos.
# Dez telas abertas esgotavam o pool e a API parava de responder a todos. O
# modelo não tem associação JPA (as tabelas se ligam por ids), então nada
# depende da sessão aberta fora dos services.
spring.jpa.open-in-view=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# A API só recebe JSON (e multipart nas duas rotas de foto). O FormContentFilter
# lia corpos form-urlencoded de PUT/PATCH/DELETE de qualquer um, antes da
# autenticação, e um corpo acima do teto de LimiteDoCorpo estourava ali como
# erro 500. Sem uso nenhum aqui, fica desligado.
spring.mvc.formcontent.filter.enabled=false

app.upload-dir=uploads

# --- Chave dos tokens (sessões e goniômetros pareados) ---
# Quem conhece esta chave assina token de qualquer conta, então ela não tem
# valor-padrão no repositório. Gere com "openssl rand -base64 64" (mínimo de
# 32 bytes). Trocá-la derruba todas as sessões e todos os goniômetros, que
# precisam ser pareados de novo.
#
# Sem chave, a API só sobe fora de produção, com uma chave sorteada a cada
# subida (e um aviso no log). Produção é o perfil cloud, que liga a exigência,
# ou qualquer serviço no Render, que define RENDER=true em todos eles.
rehabit.jwt.secret=${REHABIT_JWT_SECRET:}
rehabit.jwt.segredo-obrigatorio=${REHABIT_JWT_SEGREDO_OBRIGATORIO:${RENDER:false}}
# 30 dias: 4h obrigava o profissional a refazer login várias vezes no mesmo
# dia de atendimento. Trocar ou redefinir a senha derruba os tokens emitidos
# antes (JwtAuthenticationFilter), e "Sair" limpa a sessão do aparelho na hora.
rehabit.jwt.expiracao-ms=${REHABIT_JWT_EXPIRACAO_MS:2592000000}

# --- Limites de tentativas (veja Limite e LimiteDeTentativas) ---
# Login, cadastro, envio de e-mail, códigos, pareamento e upload. A contagem
# fica em memória: some quando a API reinicia, o que basta para frear robô.
rehabit.limites.ativo=${REHABIT_LIMITES_ATIVO:true}
# Quantos proxies de confiança ficam na frente da API (veja IpDoCliente). Com
# 1, o IP do cliente é o último endereço do X-Forwarded-For, o que o proxy
# acrescentou; os anteriores vêm do próprio cliente e podem ser inventados.
# Com 0, vale o endereço da conexão. Em branco = automático: 1 no Render, 0
# fora dele (rodando local, ninguém na frente reescreve o cabeçalho).
rehabit.rede.proxies-confiaveis=${REHABIT_PROXIES_CONFIAVEIS:}

# --- Envio de e-mail (recuperação de senha e confirmação de cadastro) ---
# Dois caminhos de saída, escolhidos por qual deles estiver configurado:
#
#   BREVO_API_KEY + MAIL_FROM -> API HTTP do Brevo. É o caminho de produção:
#     o plano gratuito do Render bloqueia as portas de SMTP (25, 465 e 587)
#     desde setembro de 2025, e por HTTPS na 443 passa.
#   MAIL_USERNAME + MAIL_PASSWORD -> SMTP. Serve para rodar local e para
#     hospedagem que não bloqueia essas portas. No Gmail é preciso uma
#     "senha de app", não a senha da conta.
#   Nenhum dos dois -> o e-mail é escrito no console e a API segue
#     funcionando, o que basta para desenvolver e demonstrar.
rehabit.mail.brevo.api-key=${BREVO_API_KEY:}
# Só muda em teste, para apontar para um servidor falso; em branco usa o
# endereço real da API do Brevo.
rehabit.mail.brevo.url=${BREVO_API_URL:}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

rehabit.mail.remetente=${MAIL_FROM:${MAIL_USERNAME:}}
rehabit.mail.nome-remetente=${MAIL_FROM_NAME:Rehabit}

# Endereço público da pasta Login/ (ex.: https://usuario.github.io/Rehabit/Login).
# Quando vazio, o e-mail de recuperação traz só o código de 6 dígitos —
# sem link, porque abrindo o site por file:// não existe URL para apontar.
rehabit.app.url-login=${REHABIT_APP_URL:}

# Validade do código/link de recuperação de senha e do código de cadastro.
rehabit.recuperacao.expiracao-minutos=${REHABIT_RECUPERACAO_EXPIRACAO_MIN:30}
rehabit.verificacao.expiracao-minutos=${REHABIT_VERIFICACAO_EXPIRACAO_MIN:15}

# Checagem de DNS (registro MX) do domínio do e-mail no cadastro.
rehabit.email.validar-dns=${REHABIT_VALIDAR_EMAIL_DNS:true}
# Exigir código enviado por e-mail para concluir o cadastro. Em branco =
# automático: liga quando o envio de e-mail está configurado.
rehabit.email.confirmar-cadastro=${REHABIT_CONFIRMAR_CADASTRO:}

# --- Verificação antirrobô (Cloudflare Turnstile) ---
# Chave secreta do widget no painel da Cloudflare (Turnstile > o widget >
# Settings). Confere o token que o site manda no login, no envio do código de
# cadastro, na recuperação de senha e, quando o cadastro não pede código por
# e-mail, no próprio /register. Em branco = desligada, que é como roda local e
# nos testes. A site key (pública) fica no Login/turnstile.js.
rehabit.turnstile.secret=${TURNSTILE_SECRET_KEY:}

# --- Auto-ping contra a hibernação do Render (veja ManterApiAcordada) ---
# URL pública da própria API. RENDER_EXTERNAL_URL é definida pelo Render em
# todo web service; fora dele fica vazia e o auto-ping não liga, para que
# rodar a API local não saia batendo na produção.
rehabit.keepalive.url=${REHABIT_KEEPALIVE_URL:${RENDER_EXTERNAL_URL:}}
# Deixa a instância acordada 24 h (~720-744 h/mês das 750 gratuitas). Se a
# conta do Render tiver outro web service gratuito, as horas não fecham:
# defina REHABIT_KEEPALIVE_ATIVO=false.
rehabit.keepalive.ativo=${REHABIT_KEEPALIVE_ATIVO:true}
rehabit.keepalive.intervalo-ms=${REHABIT_KEEPALIVE_INTERVALO_MS:300000}
rehabit.keepalive.atraso-inicial-ms=${REHABIT_KEEPALIVE_ATRASO_INICIAL_MS:60000}

# Commit que está no ar: o Render define RENDER_GIT_COMMIT em cada deploy. O
# /api/health o mostra, e o workflow manter-api-acordada.yml avisa quando ele
# fica para trás do último commit da API no main (o deploy não aconteceu).
rehabit.versao=${RENDER_GIT_COMMIT:}

# --- Conta de demonstração ---
# A Clínica Movimento, com cinco profissionais e vinte e um pacientes com
# meses de histórico e agenda (veja ContaDeDemonstracao). A Ana Paula Ribeiro,
# uma das profissionais dela, é a conta que o botão "Entrar na demonstração"
# da página inicial abre. Sobe sempre, sem variável nenhuma no Render;
# REHABIT_DEMO=false a desliga. Fica em dia sozinha (é refeita com as datas
# do dia quando sobra consulta marcada para um dia que já passou). Todas as contas dela entram com a
# senha abaixo, que está no site (Login/demonstracao.js): por isso são só de
# leitura.
rehabit.demo.ativar=${REHABIT_DEMO:true}
rehabit.demo.senha=${REHABIT_DEMO_SENHA:Rehabit@2026}

# --- Conta da apresentação ---
# A Clínica Alvorada (Atibaia), com quatro profissionais e catorze pacientes
# (veja ContaDeApresentacao), para a banca do TCC. Sobe sempre, sem variável
# nenhuma; REHABIT_APRESENTACAO=false a desliga. Também é idempotente, e nunca
# é refeita: segue atendendo sozinha.
rehabit.apresentacao.ativar=${REHABIT_APRESENTACAO:true}
# Senha da clínica e dos quatro profissionais. O padrão é a senha que a
# equipe escolheu para a banca, e ela está neste repositório, que é público:
# para uma só da equipe, defina REHABIT_APRESENTACAO_SENHA no Render. Se
# alguém a trocar pela tela, a próxima subida ou madrugada a põe de volta.
rehabit.apresentacao.senha=${REHABIT_APRESENTACAO_SENHA:Rehabit1234@}
