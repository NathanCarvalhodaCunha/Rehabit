# Perfil "test", ativado por @ActiveProfiles na base dos testes. Sobrepõe o
# application.properties principal só no que precisa ser diferente — o resto
# (segredo do JWT, validade do token etc.) continua vindo de lá.
#
# Tem que ser um perfil, e não um application.properties em src/test: com o
# mesmo nome, o de teste sombreia o principal no classpath por inteiro, e a
# aplicação nem sobe (falta o segredo do JWT).

# Banco em memória, zerado a cada execução: os testes nunca encostam no H2 de
# arquivo em ./data, que guarda os dados de quem roda a API na máquina.
spring.datasource.url=jdbc:h2:mem:rehabit-testes;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop

# Fotos vão para uma pasta própria dos testes, que eles mesmos limpam. Assim
# um teste de exclusão de foto nunca apaga nada da pasta uploads/ de verdade.
app.upload-dir=target/uploads-testes

# Nada de consulta de DNS nem envio de e-mail durante os testes.
rehabit.email.validar-dns=false
rehabit.email.confirmar-cadastro=false
