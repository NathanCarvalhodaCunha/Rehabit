    <div class="mobile-topbar">
      <button data-action="back" aria-label="Voltar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <span></span>
    </div>

    <main class="main form-main">
      <header class="form-header">
        <h1>Cadastrar Paciente</h1>
        <p>Preencha as informações</p>
      </header>
      <div class="form-mobile-head">
        <h1>Cadastrar Paciente</h1>
        <p>Preencha as informações</p>
      </div>

      <div class="form-avatar-outside mobile-only">
        <button type="button" class="form-avatar" data-avatar-picker aria-label="Escolher foto de perfil"></button>
        <p class="caption">Foto de perfil</p>
      </div>

      <form id="cadastrarPacienteForm" class="card form-card">
        <input type="file" id="pfoto" accept="image/*" hidden />
        <div class="form-split">
          <div class="form-avatar-col">
            <h3 class="form-col-title">Informações</h3>
            <p class="caption">Foto de perfil</p>
            <button type="button" class="form-avatar" data-avatar-picker aria-label="Escolher foto de perfil"></button>
          </div>
          <div>
            <div class="field field-id">
              <label for="cpf">CPF</label>
              <input id="cpf" type="text" required />
            </div>
            <hr class="form-sep" />
            <div class="two-col">
              <div class="field">
                <label for="nome">Nome</label>
                <input id="nome" type="text" placeholder="Ex: Ana Carolina Silva" required />
              </div>
              <div class="field">
                <label for="nasc">Data de nascimento</label>
                <input id="nasc" type="date" />
              </div>
            </div>
            <div class="two-col">
              <div class="field">
                <label for="sexo">Sexo</label>
                <select id="sexo">
                  <option value="" selected>Selecione</option>
                  <option>Feminino</option>
                  <option>Masculino</option>
                  <option>Outro</option>
                </select>
              </div>
              <div class="field">
                <label for="situacao">Situação</label>
                <input id="situacao" type="text" placeholder="Ex: Lesão de manguito rotador" />
              </div>
            </div>
          </div>
        </div>
        <hr class="form-sep" />
        <div class="form-actions">
          <button type="submit" class="btn-primary">Cadastrar Paciente</button>
        </div>
      </form>
    </main>
