<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Instituição — Rehabit</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./loader.css" />
</head>
<body>
  <div class="app">
    <!-- Sidebar (desktop) -->
    <aside class="sidebar">
      <a href="#" class="logo" data-action="go-list" aria-label="Ir para a Home"><img src="./assets/rehabit-logo.png" alt="Rehabit" /></a>
      <nav class="nav">
        <a href="./instituicao.html" class="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12 12 3l9 9"/><path d="M5 10v10h14V10"/></svg>
          Home
        </a>
        <a href="./dispositivo.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
          Dispositivo
        </a>
        <a href="./consultas.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Consultas
        </a>
        <a href="./perfil-instituicao.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>
          Perfil
        </a>
        <a href="./configuracoes.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1A2 2 0 1 1 7 4.3l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          Configurações
        </a>
      </nav>
      <a href="#" class="logout" data-action="logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sair
      </a>
    </aside>

    <!-- Mobile top bar -->
    <div class="mobile-topbar inst-mobile-top">
      <button data-action="logout" aria-label="Sair">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
      <div class="mobile-avatar" aria-hidden="true"></div>
    </div>

    <main class="main">
      <header class="inst-header">
        <div class="inst-greeting">
          <h1></h1>
          <p></p>
        </div>
        <div class="inst-user desktop-only">
          <div class="inst-avatar" aria-hidden="true"></div>
          <div class="inst-user-meta">
            <span class="name"></span>
            <span class="role">Admnistrador</span>
          </div>
        </div>
      </header>

      <div class="kpi-grid"></div>

      <div class="page-grid">
       <div class="col-main">
      <section class="card list-card">
        <div class="list-head desktop-only">
          <h2>Lista de Fisioterapeutas</h2>
          <div class="list-controls">
            <input type="text" class="list-search" placeholder="" aria-label="Buscar" />
            <div class="select-wrap">
              <select class="list-filter">
                <option>Fisioterapeutas</option>
                <option>Ordem alfabética</option>
                <option>Mais pacientes</option>
              </select>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </div>
          </div>
        </div>

        <div class="mobile-only">
          <input type="text" class="list-search" placeholder="" aria-label="Buscar" />
        </div>

        <div class="list-columns desktop-only">
          <span>Fisioterapeuta</span>
          <span>Especialidade</span>
          <span class="right">Pacientes Ativos</span>
        </div>

        <ul class="fisio-list"></ul>

        <a href="#" class="show-more desktop-only" data-action="show-more">Mostrar mais</a>
      </section>
       </div>

       <div class="col-side">
        <section class="card alertas-card" data-alertas>
          <div class="alertas-head">
            <h2>Alertas</h2>
            <span data-alertas-contagem></span>
          </div>
          <ul class="alertas-lista" data-alertas-lista></ul>
        </section>

        <section class="card list-card agenda-home-card">
          <div class="list-head">
            <h2>Próximas consultas</h2>
            <a href="./consultas.html" class="show-more">Ver todas</a>
          </div>
          <ul class="agenda-list"></ul>
        </section>

        <section class="card register-pro-card desktop-only">
          <h3>Cadastre um profissional</h3>
          <p>Vincule um profissional à sua instituição</p>
          <button class="btn-primary" type="button" data-action="add-fisio">Cadastrar Profissional</button>
        </section>
       </div>
      </div>
    </main>

    <button class="fab mobile-only" data-action="add-fisio" aria-label="Adicionar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>

    <!-- Mobile bottom nav -->
    <nav class="mobile-bottomnav">
      <a href="./dispositivo.html" aria-label="Dispositivo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
      </a>
      <a href="./instituicao.html" aria-label="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12 12 3l9 9"/><path d="M5 10v10h14V10"/></svg>
      </a>
      <a href="./configuracoes.html" aria-label="Configurações">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1A2 2 0 1 1 7 4.3l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </a>
    </nav>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="./toast.js"></script>
  <script src="./loader.js"></script>
  <script src="./script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="./animations.js"></script>
  <script src="./notificacoes.js"></script>
  <script src="./busca.js"></script>
  <script src="./tutorial.js"></script>
  <script src="./pages/indicadores.js"></script>
  <script src="./pages/alertas.js"></script>
  <script src="./pages/instituicao.js"></script>
</body>
</html>
