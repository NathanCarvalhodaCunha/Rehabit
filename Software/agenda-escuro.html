        <a href="./dispositivo-escuro.html">

          Dispositivo

        <a href="./agenda-escuro.html" class="active">

          Agenda
        </a>
        <a href="#" data-action="go-profile">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>
          Perfil
        </a>
        <a href="./configuracoes-escuro.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1A2 2 0 1 1 7 4.3l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          Configurações
        </a>
      </nav>
      <a href="#" class="logout" data-action="logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sair
      </a>
    </aside>

    <!-- Mobile top bar -->
    <div class="mobile-topbar">
      <button data-action="back" aria-label="Voltar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <h2 class="mobile-title">Agenda</h2>
      <span aria-hidden="true" style="width:32px"></span>
    </div>

    <main class="main form-main">
      <header class="page-header desktop-only">
        <h1>Agenda</h1>
        <p>Marque e acompanhe as próximas sessões dos seus pacientes</p>
      </header>

      <div class="page-grid">
       <div class="col-main">
      <section class="card form-card">
        <h3>Novo agendamento</h3>
        <form id="agendamentoForm">
          <div class="field">
            <label for="ag-paciente">Paciente</label>
            <select id="ag-paciente" required>
              <option value="">Selecione um paciente</option>
            </select>
          </div>
          <div class="two-col">
            <div class="field">
              <label for="ag-data">Data</label>
              <input id="ag-data" type="date" required />
            </div>
            <div class="field">
              <label for="ag-hora">Horário</label>
              <input id="ag-hora" type="time" required />
            </div>
          </div>
          <div class="field">
            <label for="ag-obs">Observação</label>
            <input id="ag-obs" type="text" placeholder="Ex: Trazer exames anteriores" />
          </div>
          <div class="form-actions">
            <button type="submit" class="btn-primary">Agendar</button>
          </div>
        </form>
      </section>

      <h2 class="section-title" data-titulo-lista>Próximos agendamentos</h2>
      <section class="card list-card">
        <ul class="agenda-list"></ul>
      </section>
       </div>

       <div class="col-side">
        <section class="card cal-card">
          <div data-calendario></div>
          <div class="cal-acoes">
            <button type="button" class="btn-outline" data-action="exportar-ics">Baixar agenda (.ics)</button>
          </div>
        </section>
       </div>
      </div>
    </main>

    <!-- Mobile bottom nav -->
    <nav class="mobile-bottomnav">
      <a href="./dispositivo-escuro.html" aria-label="Dispositivo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
      </a>
      <a href="#" aria-label="Home" data-action="go-list">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12 12 3l9 9"/><path d="M5 10v10h14V10"/></svg>
      </a>
      <a href="./configuracoes-escuro.html" aria-label="Configurações">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1A2 2 0 1 1 7 4.3l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </a>
    </nav>
  </div>
