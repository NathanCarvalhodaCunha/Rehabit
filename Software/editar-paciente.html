    <main class="main edit-main">
      <header class="edit-header">
        <h1>Editar Paciente</h1>
        <p>Atualize as informações do paciente</p>
      </header>

      <form class="edit-grid" onsubmit="event.preventDefault();">
        <input type="file" id="pfoto" accept="image/*" hidden />
        <section class="card edit-avatar-card">
          <div class="avatar-lg" aria-hidden="true" data-avatar-picker style="cursor:pointer;"></div>
          <button type="button" class="btn-outline" data-avatar-picker>Alterar foto</button>
          <h2 class="edit-name"></h2>
          <p class="edit-role"></p>
        </section>

        <section class="card edit-info-card">
          <h3>Informações</h3>
          <div class="edit-section">
            <div class="field">
              <label for="p-cpf">CPF</label>
              <input id="p-cpf" type="text" value="" disabled />
            </div>
            <div class="field">
              <label for="p-nome">Nome completo</label>
              <input id="p-nome" type="text" value="" />
            </div>
            <div class="two-col">
              <div class="field">
                <label for="p-nasc">Data de nascimento</label>
                <input id="p-nasc" type="date" value="" />
              </div>
              <div class="field">
                <label for="p-sexo">Sexo</label>
                <select id="p-sexo">
                  <option value="">Selecione</option>
                  <option>Feminino</option>
                  <option>Masculino</option>
                  <option>Outro</option>
                </select>
              </div>
            </div>
          </div>
          <hr class="edit-sep" />
          <div class="edit-section">
            <div class="two-col">
              <div class="field">
                <label for="p-tel">Telefone</label>
                <input id="p-tel" type="tel" value="" />
              </div>
              <div class="field">
                <label for="p-email">E-mail</label>
                <input id="p-email" type="email" value="" />
              </div>
            </div>
            <div class="two-col">
              <div class="field">
                <label for="p-situacao">Situação</label>
                <input id="p-situacao" type="text" placeholder="Ex: Lesão de manguito rotador" />
              </div>
              <div class="field">
                <label for="p-status">Status do tratamento</label>
                <select id="p-status">
                  <option value="Ativo">Em tratamento</option>
                  <option value="Alta">Alta</option>
                  <option value="Inativo">Inativo</option>
                </select>
              </div>
            </div>
          </div>
          <hr class="edit-sep" />
          <div class="edit-section">
            <h3 class="edit-sub">Anamnese</h3>
            <div class="field">
              <label for="p-queixa">Queixa principal</label>
              <textarea id="p-queixa" rows="2" placeholder="O que trouxe o paciente à fisioterapia"></textarea>
            </div>
            <div class="field">
              <label for="p-historico">Histórico clínico</label>
              <textarea id="p-historico" rows="2" placeholder="Cirurgias, lesões anteriores, comorbidades"></textarea>
            </div>
            <div class="two-col">
              <div class="field">
                <label for="p-medicamentos">Medicamentos em uso</label>
                <textarea id="p-medicamentos" rows="2"></textarea>
              </div>
              <div class="field">
                <label for="p-contra">Contraindicações</label>
                <textarea id="p-contra" rows="2" placeholder="Movimentos ou cargas a evitar"></textarea>
              </div>
            </div>
          </div>
          <hr class="edit-sep" />
          <div class="edit-section">
            <h3 class="edit-sub">Meta de tratamento</h3>
            <div class="two-col">
              <div class="field">
                <label for="p-meta-amplitude">Amplitude alvo (graus)</label>
                <input id="p-meta-amplitude" type="number" step="0.01" min="0" placeholder="Ex: 90" />
              </div>
              <div class="field">
                <label for="p-meta-data">Prazo</label>
                <input id="p-meta-data" type="date" />
              </div>
            </div>
          </div>
          <div class="edit-actions">
            <button type="submit" class="btn-primary">Salvar alterações</button>
          </div>
        </section>
      </form>
    </main>
