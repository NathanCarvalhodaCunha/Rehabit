<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cadastrar Sessão — Rehabit</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./loader.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a href="#" class="logo"><img src="./assets/rehabit-logo.png" alt="Rehabit" /></a>
      <nav class="nav">
        <a href="./profissional.html" class="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12 12 3l9 9"/><path d="M5 10v10h14V10"/></svg>
          Home
        </a>
        <a href="./dispositivo.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
          Dispositivo
        </a>
        <a href="./agenda.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Agenda
        </a>
        <a href="./perfil-profissional.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>
          Perfil
        </a>
        <a href="./configuracoes.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1A2 2 0 1 1 7 4.3l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          Configurações
        </a>
      </nav>
      <a href="../Login/login.html" class="logout" data-action="logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sair
      </a>
    </aside>

    <div class="mobile-topbar">
      <button data-action="back" aria-label="Voltar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <span></span>
    </div>

    <main class="main">
      <header class="patient-header">
        <div class="avatar-lg" aria-hidden="true"></div>
        <div>
          <h1></h1>
          <p class="patient-meta desktop-only"></p>
          <p class="patient-meta mobile-only"></p>
        </div>
      </header>

      <div class="tabs">
        <a class="tab" href="./paciente.html">Visão Geral</a>
        <button class="tab active">Sessões</button>
      </div>

      <div class="info-strip mobile-only">
        <div>
          <div class="k">Início do tratamento</div>
          <div class="v"></div>
        </div>
        <div>
          <div class="k">Profissional</div>
          <div class="v"></div>
        </div>
      </div>

      <section class="session-grid">
        <div class="card sessions-table">
          <table>
            <thead>
              <tr>
                <th>Data</th>
                <th>Duração</th>
                <th><span class="desktop-only">Amplitude média</span><span class="mobile-only">Amplitude</span></th>
                <th>Avanço</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <form id="cadastrarSessaoForm" class="card add-manual-card">
          <h3>Adicionar dados manualmente</h3>
          <p class="sub">Registre os dados de uma sessão</p>
          <div class="field">
            <label for="s-data">Data</label>
            <input id="s-data" type="date" required />
          </div>
          <div class="field">
            <label for="s-dur">Duração (minutos)</label>
            <input id="s-dur" type="number" min="1" required />
          </div>
          <div class="field">
            <label for="s-amp">Amplitude média (graus)</label>
            <input id="s-amp" type="number" step="0.01" />
          </div>
          <div class="form-actions">
            <button type="submit" class="btn-primary">Cadastrar sessão</button>
          </div>
        </form>
      </section>
    </main>

    <nav class="mobile-bottomnav">
      <a href="./dispositivo.html" aria-label="Dispositivo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
      </a>
      <a href="./profissional.html" aria-label="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12 12 3l9 9"/><path d="M5 10v10h14V10"/></svg>
      </a>
      <a href="./configuracoes.html" aria-label="Configurações">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1A2 2 0 1 1 7 4.3l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </a>
    </nav>
  </div>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="./toast.js"></script>
  <script src="./loader.js"></script>
  <script src="./script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="./animations.js"></script>
  <script src="./notificacoes.js"></script>
  <script src="./pages/cadastrar-sessao.js"></script>
</body>
</html>
