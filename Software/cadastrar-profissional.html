      <a href="../Login/login.html" class="logout" data-action="logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>

    <div class="mobile-topbar">
      <button data-action="back" aria-label="Voltar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <span></span>
    </div>

    <main class="main form-main">
      <header class="form-header">
        <h1>Cadastrar Profissional</h1>
        <p>Vincule um profissional à instituição</p>
      </header>
      <div class="form-mobile-head">
        <h1>Cadastrar Profissional</h1>
        <p>Vincule um profissional à instituição</p>
      </div>

      <div class="form-avatar-outside mobile-only">
        <button type="button" class="form-avatar" data-avatar-picker aria-label="Escolher foto de perfil"></button>
        <p class="caption">Foto de perfil</p>
      </div>

      <form id="cadastrarProfissionalForm" class="card form-card">
        <input type="file" id="pfoto" accept="image/*" hidden />
        <div class="form-split">
          <div class="form-avatar-col">
            <h3 class="form-col-title">Informações</h3>
            <p class="caption">Foto de perfil</p>
            <button type="button" class="form-avatar" data-avatar-picker aria-label="Escolher foto de perfil"></button>
          </div>
          <div>
            <h3>Insira o COFFITO do profissional</h3>
            <div class="field field-id">
              <label for="pid">COFFITO</label>
              <input id="pid" type="text" required />
            </div>
            <hr class="form-sep" />
            <div class="two-col">
              <div class="field">
                <label for="pnome">Nome</label>
                <input id="pnome" type="text" required />
              </div>
              <div class="field">
                <label for="ptel">Telefone</label>
                <input id="ptel" type="tel" />
              </div>
            </div>
            <div class="two-col">
              <div class="field">
                <label for="pmail">E-mail</label>
                <input id="pmail" type="email" required />
              </div>
              <div class="field">
                <label for="psenha">Senha</label>
                <input id="psenha" type="password" autocomplete="new-password" required />
              </div>
            </div>
            <div class="two-col">
              <div class="field">
                <label for="pesp">Especialidade</label>
                <input id="pesp" type="text" />
              </div>
              <div class="field">
                <label for="ploc">Localidade</label>
                <input id="ploc" type="text" />
              </div>
            </div>
          </div>
        </div>
        <div class="field">
          <label for="pdesc">Descrição</label>
          <textarea id="pdesc" rows="5"></textarea>
        </div>
        <hr class="form-sep" />
        <div class="form-actions">
          <button type="submit" class="btn-primary">Cadastrar profissional</button>
        </div>
      </form>
    </main>

    <nav class="mobile-bottomnav">
      <a href="./dispositivo.html" aria-label="Dispositivo">

      </a>
      <a href="./instituicao.html" aria-label="Home">

      </a>
      <a href="./configuracoes.html" aria-label="Configurações">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1A2 2 0 1 1 7 4.3l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </a>
    </nav>
