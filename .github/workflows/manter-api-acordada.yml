# Rede de segurança do auto-ping, e alarme quando ele falha.
#
# Quem mantém a API acordada é ela mesma: ManterApiAcordada chama o próprio
# /api/health pela URL pública a cada 5 min, e o Render conta isso como
# tráfego. Este workflow já foi o mecanismo principal e não funcionou — o
# agendador do GitHub é "melhor esforço" e, pedindo uma execução a cada
# 10 min, entregou 6 por dia, com intervalos de 2 a 7 horas. Cada uma
# encontrava a API dormindo e saía verde mesmo assim, porque o 200 acabava
# chegando; a falha passou dias escondida atrás de um aviso que ninguém lê.
#
# Agora ele tem três papéis:
#
#  - Acordar a instância se ela parar por algum motivo que o auto-ping não
#    cobre (ele não roda com o processo parado).
#  - FALHAR, com e-mail do GitHub, quando encontrar sinal de que o auto-ping
#    não está segurando a instância. Com o auto-ping funcionando, nenhuma
#    execução deveria encontrar a API dormindo.
#  - FALHAR também quando a API no ar não tiver o último commit dela no main:
#    o site (Vercel) publica cada merge sozinho, mas a API depende do deploy
#    do Render, que de 14 a 21/10/2026 não aconteceu — e o site passou a pedir
#    contas que a API velha não tinha, sem nada avisar.
#
# Se a conta do Render tiver outro web service gratuito e o auto-ping for
# desligado (REHABIT_KEEPALIVE_ATIVO=false), desative este workflow também
# na aba Actions: ele passaria a falhar em toda execução, com razão.
#
# O GitHub desliga workflows agendados depois de 60 dias sem atividade no
# repositório; se as execuções pararem, é só reativar na aba Actions.
name: Manter a API acordada

on:
  schedule:
    # Minuto 3, 13, 23... e não 0, 10, 20: a virada da hora é o horário de
    # maior carga do agendador do GitHub, e é quando ele mais atrasa ou
    # descarta execuções. Não resolve o atraso — por isso ele não é mais o
    # mecanismo principal —, só melhora as chances.
    - cron: "3-59/10 * * * *"
  # Permite checar (ou acordar) a API na mão pela aba Actions — útil uns
  # minutos antes de uma apresentação.
  workflow_dispatch:

# Um curl na API pública e duas consultas de leitura à API do GitHub (o último
# commit da API no main): o token só precisa ler o conteúdo do repositório.
permissions:
  contents: read

concurrency:
  group: manter-api-acordada
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Bater no /api/health e conferir o auto-ping
        env:
          URL: https://rehabit-api-4tex.onrender.com/api/health
        run: |
          # O corpo vai para arquivo e só as métricas para a stdout: cada
          # tentativa do --retry reimprime o corpo, e na mesma saída eles se
          # emendariam. --max-time generoso porque, se a instância estiver
          # dormindo, este ping precisa esperar o boot inteiro.
          metricas=$(curl -sS --max-time 300 --retry 2 --retry-all-errors \
                          -o resposta.json \
                          -w '%{http_code} %{time_starttransfer}' "$URL") || {
            echo "::error::Não consegui falar com a API — o curl nem completou."
            exit 1
          }

          http=${metricas% *}
          tempo=${metricas#* }
          echo "HTTP $http em ${tempo}s"
          echo "Resposta: $(cat resposta.json)"

          if [ "$http" != "200" ]; then
            echo "::error::A API respondeu $http — esperado 200."
            exit 1
          fi

          auto=$(jq -r '.autoPing' resposta.json)
          uptime=$(jq -r '.uptimeSegundos' resposta.json)
          ultimo=$(jq -r '.ultimoAutoPingSegundosAtras // "nunca"' resposta.json)
          falhou=0

          # Quente, a API responde em menos de 1 s; acima de 10 s foi boot.
          if [ "${tempo%%.*}" -ge 10 ]; then
            echo "::error::Levou ${tempo}s: a instância estava dormindo, o auto-ping não a segurou."
            falhou=1
          fi
          if [ "$auto" != "true" ]; then
            echo "::error::O auto-ping está desligado em produção (autoPing=$auto). Confira RENDER_EXTERNAL_URL e REHABIT_KEEPALIVE_ATIVO no Render."
            falhou=1
          fi
          # Nos primeiros 10 min depois de um boot o auto-ping ainda pode não
          # ter voltado nenhuma vez (o primeiro sai após 1 min); passado isso,
          # o último sucesso tem de ser recente, ou ele parou de funcionar.
          if [ "$uptime" -gt 600 ] && { [ "$ultimo" = "nunca" ] || [ "$ultimo" -gt 600 ]; }; then
            echo "::error::Último auto-ping bem-sucedido: $ultimo (s atrás), com a instância de pé há ${uptime}s. Veja os logs do Render (\"Auto-ping falhou\")."
            falhou=1
          fi

          exit $falhou

      - name: Conferir se o Render publicou o último commit da API
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # O /api/health diz o commit no ar (RENDER_GIT_COMMIT). Ele tem de
          # conter o último commit que mexeu na API. Uma hora depois do último
          # merge no main sobra tempo para o build e o deploy do Render; antes
          # disso, um deploy em andamento não é falha. Problema na consulta ao
          # GitHub vira só aviso: este passo não acusa o que não conseguiu ver.
          gh_api() {
            curl -sS --max-time 30 -H "Authorization: Bearer $GH_TOKEN" \
                 -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/$1"
          }
          versao=$(jq -r '.versao // ""' resposta.json)
          main_quando=$(gh_api "commits/main" | jq -r '.commit.committer.date // empty') || main_quando=""
          ultimo=$(gh_api "commits?sha=main&path=rehabit-api/rehabit-api&per_page=1" | jq -r '.[0].sha // empty') || ultimo=""
          if [ -z "$main_quando" ] || [ -z "$ultimo" ]; then
            echo "::warning::Não consegui consultar o GitHub agora; o deploy fica para a próxima execução."
            exit 0
          fi
          echo "Último commit da API no main: ${ultimo:0:7}. No ar: ${versao:-(não informado)}."

          idade=$(( $(date +%s) - $(date -d "$main_quando" +%s) ))
          if [ "$idade" -lt 3600 ]; then
            echo "O main mudou há $((idade / 60)) min: o deploy do Render pode estar em andamento."
            exit 0
          fi

          if [ -z "$versao" ]; then
            echo "::error::A API no ar não informa o commit: ela é de antes de ${ultimo:0:7}. O Render não publicou o último merge — no painel do Render, veja Events e faça Manual Deploy → Deploy latest commit."
            exit 1
          fi
          situacao=$(gh_api "compare/$ultimo...$versao" | jq -r '.status // empty') || situacao=""
          case "$situacao" in
            identical|ahead)
              echo "A API no ar tem o último commit dela." ;;
            "")
              echo "::warning::Não consegui comparar ${ultimo:0:7} com ${versao:0:7} no GitHub agora." ;;
            *)
              echo "::error::A API no ar (${versao:0:7}) não tem o commit ${ultimo:0:7}: o Render não publicou o último merge. No painel do Render, veja Events e faça Manual Deploy → Deploy latest commit."
              exit 1 ;;
          esac
