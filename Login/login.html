<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rehabit — Software para clínicas de fisioterapia</title>
  <link rel="icon" href="../favicon.ico" sizes="32x32" />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
  <link rel="manifest" href="../site.webmanifest" />
  <meta name="theme-color" content="#1565d8" />
  <meta name="description" content="O Rehabit organiza a clínica de fisioterapia: pacientes, profissionais, agenda, sessões e amplitude de movimento medida com goniômetro digital." />
  <!-- Endereço oficial: a cópia no GitHub Pages aponta para cá e não concorre na busca -->
  <link rel="canonical" href="https://rehabit.com.br/Login/login.html" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Rehabit" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:url" content="https://rehabit.com.br/Login/login.html" />
  <meta property="og:title" content="Rehabit — Software para clínicas de fisioterapia" />
  <meta property="og:description" content="Pacientes, sessões e amplitude de movimento medida com goniômetro digital, num só lugar." />
  <meta property="og:image" content="https://rehabit.com.br/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Logo do Rehabit ao lado de um fisioterapeuta examinando o joelho de um paciente" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="loader.css" />
</head>
<body>
  <main class="shell image-left">
    <!-- Photo panel (left on desktop) -->
    <div class="photo">
      <img src="assets/physio.jpg" width="675" height="675" fetchpriority="high" alt="Fisioterapeuta manipulando o joelho de um paciente" />
      <!-- Curved white divider on the right (form-facing) edge -->
      <div class="divider right" aria-hidden="true">
        <svg viewBox="0 0 120 1000" preserveAspectRatio="none">
          <path d="M120,0 L60,0 C90,250 20,500 50,750 C70,900 100,950 120,1000 Z" fill="currentColor" />
        </svg>
      </div>
    </div>

    <!-- Form panel -->
    <section class="form-side">
      <div class="form-wrap">
        <form id="loginForm" class="form-content" novalidate>
          <img class="logo" src="assets/rehabit-logo.png" alt="Rehabit" />

          <h1>Bem-vindo de volta</h1>
          <p class="subtitle">Faça login para acessar sua conta</p>

          <div class="fields">
            <div class="field">
              <label for="email">E-mail</label>
              <input id="email" name="email" type="email" autocomplete="email" required />
            </div>
            <div class="field">
              <label for="password">Senha</label>
              <input id="password" name="password" type="password" autocomplete="current-password" required />
            </div>
          </div>

          <p class="forgot-link"><a href="esqueci-senha.html">Esqueceu a senha?</a></p>

          <div class="rh-captcha" data-rh-captcha></div>
          <button class="btn-primary" type="submit">Entrar</button>

          <p class="footer-link">
            Não possui uma conta? <a href="register.html">Cadastre-se</a>
          </p>
        </form>
      </div>
    </section>
  </main>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="toast.js"></script>
  <script src="password-toggle.js"></script>
  <script src="demonstracao.js"></script>
  <script src="loader.js"></script>
  <script src="turnstile.js"></script>
  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="animations.js"></script>
</body>
</html>
